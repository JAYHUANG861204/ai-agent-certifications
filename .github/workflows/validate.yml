name: 驗證證照資料

on:
  pull_request:
    paths:
      - 'data/certs.json'
  push:
    branches: [master]
    paths:
      - 'data/certs.json'
  workflow_dispatch:

jobs:
  validate:
    name: 檢查 data/certs.json 格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate.mjs
